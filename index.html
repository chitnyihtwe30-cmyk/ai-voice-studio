<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Voice Studio • Myanmar Voice</title><style>:root{--card:#111729;--line:#ffffff18;--muted:#aeb8cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#39206b,transparent 35%),linear-gradient(145deg,#05060b,#0b1020);color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#111729ee;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 25px 80px #0008}h1{margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.count{text-align:right;color:#9da7bd;font-size:11px}.lang{display:flex;gap:8px;margin:12px 0}.lang button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:#fff}.lang button.on{border-color:#06b6d4;background:#06b6d425}textarea,input{width:100%;background:#080b15;color:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:7px 0 14px}textarea{min-height:190px;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{background:#ffffff08;color:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left}.mode.on{border-color:#8b5cf6;background:#7c3aed25}.go,.stop{width:100%;border:0;border-radius:15px;padding:15px;font-weight:900}.go{background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff}.stop{margin-top:8px;background:#ffffff0a;color:#fff;border:1px solid var(--line)}.status{margin-top:12px;color:#aeb8cc;font-size:12px}.hide{display:none}.download{display:block;text-align:center;margin-top:10px;padding:11px;border-radius:12px;background:#ffffff0a;color:#fff;text-decoration:none;border:1px solid var(--line)}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>🇲🇲 AI Voice Studio</h1><p class="muted">UI ကို English / Myanmar ပြောင်းနိုင်ပါတယ်။ AI Voice နဲ့ Voice Clone output နှစ်ခုလုံး <b>Myanmar voice only</b> ဖြစ်ပါတယ်။</p><div class="lang"><button id="en">English</button><button id="my" class="on">Myanmar</button></div><div class="count" id="count">0 / 5,000</div><textarea id="text" maxlength="5000" placeholder="မြန်မာစာသားရေးပါ..."></textarea><div class="grid"><button id="voice" class="mode on">🔊 Myanmar AI Voice<br><small>Local Burmese TTS</small></button><button id="clone" class="mode">🎙️ Myanmar Voice Clone<br><small>Reference voice → Myanmar speech</small></button></div><div id="voicePanel"><p class="muted">Model: <b>facebook/mms-tts-mya</b> • Myanmar (mya)</p><label>Speed <b id="speedVal">1.00x</b></label><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></div><div id="clonePanel" class="hide"><p class="muted">Reference Voice Audio</p><input id="refAudio" type="file" accept="audio/*"><p class="muted">Clone engine: <b>VoxCPM2</b> • Myanmar</p><label>Speed <b id="cloneSpeedVal">1.00x</b></label><input id="cloneSpeed" type="range" min="0.5" max="2" step="0.05" value="1"></div><button id="go" class="go">▶ မြန်မာ AI အသံထုတ်မယ်</button><button id="stop" class="stop">■ ရပ်မယ်</button><div id="status" class="status">READY • REAL MYANMAR VOICE</div><audio id="player" controls class="hide" style="width:100%;margin-top:12px"></audio><a id="download" class="download hide" download="myanmar-voice.wav">⬇ Download WAV</a></section></main><script>const $=id=>document.getElementById(id);let mode='voice',audioUrl=null;const TTS='http://127.0.0.1:7861',CLONE='http://127.0.0.1:7862';$('text').oninput=()=>{$('count').textContent=$('text').value.length+' / 5,000'};$('speed').oninput=()=>{$('speedVal').textContent=Number($('speed').value).toFixed(2)+'x'};$('cloneSpeed').oninput=()=>{$('cloneSpeedVal').textContent=Number($('cloneSpeed').value).toFixed(2)+'x'};$('en').onclick=()=>{$('en').classList.add('on');$('my').classList.remove('on');$('text').placeholder='Enter Myanmar text...';$('status').textContent='UI: ENGLISH • VOICE OUTPUT: MYANMAR ONLY'};$('my').onclick=()=>{$('my').classList.add('on');$('en').classList.remove('on');$('text').placeholder='မြန်မာစာသားရေးပါ...';$('status').textContent='UI: MYANMAR • VOICE OUTPUT: MYANMAR ONLY'};$('voice').onclick=()=>{mode='voice';$('voice').classList.add('on');$('clone').classList.remove('on');$('voicePanel').classList.remove('hide');$('clonePanel').classList.add('hide');$('go').textContent='▶ မြန်မာ AI အသံထုတ်မယ်'};$('clone').onclick=()=>{mode='clone';$('clone').classList.add('on');$('voice').classList.remove('on');$('voicePanel').classList.add('hide');$('clonePanel').classList.remove('hide');$('go').textContent='▶ Myanmar Voice Clone လုပ်မယ်'};function showAudio(blob,name){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$('player').src=audioUrl;$('player').classList.remove('hide');$('download').href=audioUrl;$('download').download=name;$('download').classList.remove('hide');$('player').play().catch(()=>{})}$('go').onclick=async()=>{const t=$('text').value.trim();if(!t)return $('status').textContent='စာသားထည့်ပါ';if(t.length>5000)return $('status').textContent='စာသား 5,000 characters ထက် မကျော်ရပါ';$('download').classList.add('hide');$('status').textContent=mode==='voice'?'GENERATING • MYANMAR AI VOICE':'CLONING • MYANMAR REFERENCE VOICE';try{if(mode==='voice'){const r=await fetch(TTS+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,speed:Number($('speed').value)})});if(!r.ok)throw new Error('TTS server unavailable');showAudio(await r.blob(),'myanmar-ai-voice.wav');$('status').textContent='DONE • REAL MYANMAR AI VOICE'}else{const f=$('refAudio').files[0];if(!f)return $('status').textContent='Reference voice audio ထည့်ပါ';const form=new FormData();form.append('audio',f);form.append('text',t);form.append('speed',Number($('cloneSpeed').value));const r=await fetch(CLONE+'/clone',{method:'POST',body:form});if(!r.ok){let msg='Myanmar Voice Clone server unavailable';try{const j=await r.json();if(j.error)msg=j.error}catch(e){}throw new Error(msg)}showAudio(await r.blob(),'myanmar-voice-clone.wav');$('status').textContent='DONE • MYANMAR VOICE CLONE'}}catch(e){$('status').textContent=e.message||'AI server connection error'}};$('stop').onclick=()=>{$('player').pause();$('status').textContent='STOPPED • MYANMAR VOICE'}};</script></body></html>
