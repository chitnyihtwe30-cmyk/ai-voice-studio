<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Voice Studio • Local</title><style>:root{--bg:#070912;--card:#111729;--line:#ffffff18;--muted:#aeb8cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#39206b,transparent 35%),linear-gradient(145deg,#05060b,#0b1020);color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#111729ee;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 25px 80px #0008}h1{margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.count{text-align:right;color:#9da7bd;font-size:11px}textarea,select,input{width:100%;background:#080b15;color:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:7px 0 14px}textarea{min-height:220px;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{background:#ffffff08;color:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left}.mode.on{border-color:#8b5cf6;background:#7c3aed25}.go,.stop{width:100%;border:0;border-radius:15px;padding:15px;font-weight:900}.go{background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff}.stop{margin-top:8px;background:#ffffff0a;color:#fff;border:1px solid var(--line)}.status{margin-top:12px;color:#aeb8cc;font-size:12px}.hide{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>🎙️ AI Voice Studio</h1><p class="muted">Local phone voice studio — Gemini, API key နဲ့ cloud TTS မသုံးပါ။ စာသား 5,000 characters အထိ။</p><div class="count" id="count">0 / 5,000</div><textarea id="text" maxlength="5000" placeholder="စာသားရေးပါ..."></textarea><div class="grid"><button id="voice" class="mode on">🔊 Local Voice<br><small>ဖုန်းရဲ့ TTS engine</small></button><button id="clone" class="mode">🎙️ Voice Clone<br><small>On-device clone model</small></button></div><div id="voicePanel"><label>Language</label><select id="lang"><option value="my-MM">မြန်မာ</option><option value="en-US">English</option></select><label>Speed <b id="speedVal">1.00x</b></label><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></div><div id="clonePanel" class="hide"><p class="muted">Voice Clone model ကို ဖုန်းထဲမှာ embed လုပ်ပြီးမှ reference voice → cloned voice ကို offline generate လုပ်မယ်။ ဒီ website က sample ကို server မပို့ပါ။</p><input id="sample" type="file" accept="audio/*"></div><button id="go" class="go">▶ Local အသံထုတ်မယ်</button><button id="stop" class="stop">■ ရပ်မယ်</button><div id="status" class="status">READY • LOCAL</div></section></main><script>const $=id=>document.getElementById(id);let mode='voice';$('text').oninput=()=>{$('count').textContent=$('text').value.length+' / 5,000'};$('speed').oninput=()=>{$('speedVal').textContent=Number($('speed').value).toFixed(2)+'x'};$('voice').onclick=()=>{mode='voice';$('voice').classList.add('on');$('clone').classList.remove('on');$('voicePanel').classList.remove('hide');$('clonePanel').classList.add('hide')};$('clone').onclick=()=>{mode='clone';$('clone').classList.add('on');$('voice').classList.remove('on');$('voicePanel').classList.add('hide');$('clonePanel').classList.remove('hide')};$('go').onclick=()=>{const t=$('text').value.trim();if(!t)return $('status').textContent='စာသားထည့်ပါ';if(mode==='clone')return $('status').textContent='On-device Voice Clone model မပါသေးပါ — Gemini/server မသုံးဘဲ local model integration အဆင့်မှာရှိပါတယ်';if(window.AndroidTTS)return window.AndroidTTS.speak(t,$('lang').value,Number($('speed').value));if(!('speechSynthesis'in window))return $('status').textContent='ဒီ browser မှာ local TTS မရပါ';speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=$('lang').value;u.rate=Number($('speed').value);u.onstart=()=>$('status').textContent='SPEAKING • LOCAL';u.onend=()=>$('status').textContent='DONE • LOCAL';u.onerror=()=>$('status').textContent='Local voice မရပါ';speechSynthesis.speak(u)};$('stop').onclick=()=>{if(window.AndroidTTS)window.AndroidTTS.stop();if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent='STOPPED • LOCAL'};</script></body></html>
