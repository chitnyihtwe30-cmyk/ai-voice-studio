name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Sherpa Android AAR
        working-directory: android-webview
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar

      - name: Download local ZipVoice model
        working-directory: android-webview
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o /tmp/zipvoice.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2
          tar -xjf /tmp/zipvoice.tar.bz2 -C app/src/main/assets
          mv app/src/main/assets/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia app/src/main/assets/zipvoice
          curl -L --fail --retry 3 -o app/src/main/assets/vocos_24khz.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos_24khz.onnx
          rm -f /tmp/zipvoice.tar.bz2
          du -sh app/src/main/assets app/libs

      - name: Build Debug APK
        working-directory: android-webview
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Local-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
