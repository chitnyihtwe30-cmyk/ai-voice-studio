name: Fix Gemini Language UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini voice language switching and TTS request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- GEMINI-30-VOICE-FIX-V3 -->'
          changed = False

          # The language UI patch is already present in this repo. Keep the workflow
          # idempotent instead of failing when the marker already exists.
          if marker not in s:
              patch = r'''\n<!-- GEMINI-30-VOICE-FIX-V3 -->\n<script>\n(function(){\nconst V={Zephyr:['Bright','တောက်ပသောအသံ'],Puck:['Upbeat','စိတ်တက်ကြွသောအသံ'],Charon:['Informative','သတင်းအချက်အလက်ပေးသလိုအသံ'],Kore:['Firm','ခိုင်မာသောအသံ'],Fenrir:['Excitable','စိတ်လှုပ်ရှားဖွယ်အသံ'],Leda:['Youthful','လူငယ်ဆန်သောအသံ'],Orus:['Firm','ခိုင်မာသောအသံ'],Aoede:['Breezy','လေပြေလိုနူးညံ့သောအသံ'],Callirrhoe:['Easy-going','ပေါ့ပါးအေးဆေးသောအသံ'],Autonoe:['Bright','တောက်ပသောအသံ'],Enceladus:['Breathy','လေမှုတ်သလိုနူးညံ့သောအသံ'],Iapetus:['Clear','ရှင်းလင်းသောအသံ'],Umbriel:['Easy-going','ပေါ့ပါးအေးဆေးသောအသံ'],Algieba:['Smooth','ချောမွေ့သောအသံ'],Despina:['Smooth','ချောမွေ့သောအသံ'],Erinome:['Clear','ရှင်းလင်းသောအသံ'],Algenib:['Gravelly','ကြမ်းသံပါသောအသံ'],Rasalgethi:['Informative','သတင်းအချက်အလက်ပေးသလိုအသံ'],Laomedeia:['Upbeat','စိတ်တက်ကြွသောအသံ'],Achernar:['Soft','နူးညံ့သောအသံ'],Alnilam:['Firm','ခိုင်မာသောအသံ'],Schedar:['Even','ညီညာသောအသံ'],Gacrux:['Mature','ရင့်ကျက်သောအသံ'],Pulcherrima:['Forward','ရှေ့ဆောင်သလိုအားတက်သောအသံ'],Achird:['Friendly','ဖော်ရွေသောအသံ'],Zubenelgenubi:['Casual','ပေါ့ပေါ့ပါးပါးသောအသံ'],Vindemiatrix:['Gentle','နူးညံ့သိမ်မွေ့သောအသံ'],Sadachbia:['Lively','တက်ကြွသောအသံ'],Sadaltager:['Knowledgeable','ဗဟုသုတရှိသလိုအသံ'],Sulafat:['Warm','နွေးထွေးသောအသံ']};\nfunction apply(){const s=document.getElementById('voice');if(!s)return;const my=document.documentElement.lang!=='en';Array.from(s.options).forEach(o=>{const n=o.value||o.dataset.gn;if(!n||!V[n])return;o.dataset.gn=n;o.textContent=n+' — '+(my?V[n][1]:V[n][0]);});}\nfunction refresh(){apply();}\nconst old=window.setLang;window.setLang=function(l){if(typeof old==='function')old(l);refresh();setTimeout(refresh,50);setTimeout(refresh,300);};\nnew MutationObserver(refresh).observe(document.body,{subtree:true,childList:true,characterData:true});\nwindow.addEventListener('load',refresh);\nsetInterval(refresh,300);\n})();\n</script>\n'''
              s = s.replace('</body>', patch + '</body>')
              changed = True

          # Send the selected UI language to /api/tts so English mode is actually
          # synthesized as English instead of falling back to Burmese.
          old = "JSON.stringify({text,voice:$(\'voice\').value,style:$(\'style\').value,speed:Number($(\'speed\').value),volume:Number($(\'volume\').value)})"
          new = "JSON.stringify({text,voice:$(\'voice\').value,style:$(\'style\').value,language:currentLang,speed:Number($(\'speed\').value),volume:Number($(\'volume\').value)})"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          p.write_text(s, encoding='utf-8')
          print('Updated index.html' if changed else 'No changes needed')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Fix Gemini voice language request'; git push; fi
