name: Fix Gemini Language UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini UI language switching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- GEMINI-LANGUAGE-FIX -->'
          if marker in s:
              print('Already patched')
              raise SystemExit
          patch = r'''\n<!-- GEMINI-LANGUAGE-FIX -->\n<script>\n(function(){\n  const MY={\n    'GEMINI AI VOICE STUDIO':'GEMINI AI အသံစတူဒီယို',\n    'Voice Studio':'အသံစတူဒီယို',\n    'AI Voice':'AI အသံ',\n    'Voice style':'အသံပုံစံ',\n    'Generate Burmese speech with Gemini':'Gemini နဲ့ မြန်မာအသံထုတ်မယ်',\n    'Gemini API Key':'Gemini API Key',\n    'Show':'ပြမယ်',\n    'Hide':'ဖျောက်မယ်',\n    'READY':'အသင့်',\n    'Generated Voice':'ထွက်လာတဲ့အသံ',\n    'Download WAV':'WAV ဒေါင်းလုဒ်'\n  };\n  const EN={}; Object.keys(MY).forEach(k=>EN[MY[k]]=k);\n  function applyGeminiLang(){\n    const lang=document.documentElement.lang==='en'?'en':'my';\n    document.querySelectorAll('[data-gemini-en]').forEach(el=>{\n      el.textContent=lang==='my'?el.getAttribute('data-gemini-my'):el.getAttribute('data-gemini-en');\n    });\n    const voice=document.getElementById('voice');\n    if(voice) Array.from(voice.options).forEach(o=>{\n      if(!o.dataset.geminiEn) o.dataset.geminiEn=o.textContent;\n      o.textContent=o.dataset.geminiEn;\n    });\n  }\n  function mark(){\n    document.querySelectorAll('label,.mode span,.mode strong,.eyebrow,.outputTitle,.ready,button').forEach(el=>{\n      if(el.children.length) return;\n      const t=el.textContent.trim();\n      if(MY[t] && !el.dataset.geminiEn){\n        el.dataset.geminiEn=t; el.dataset.geminiMy=MY[t];\n      }\n    });\n    applyGeminiLang();\n  }\n  const oldSet=window.setLang;\n  window.setLang=function(lang){\n    if(typeof oldSet==='function') oldSet(lang);\n    setTimeout(mark,0);\n  };\n  new MutationObserver(mark).observe(document.body,{subtree:true,childList:true,characterData:true});\n  setTimeout(mark,50);\n})();\n</script>\n'''
          s = s.replace('</body>', patch + '</body>')
          p.write_text(s, encoding='utf-8')
          print('Patched index.html')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix Gemini UI language switching'
            git push
          fi
