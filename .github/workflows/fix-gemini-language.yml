name: Fix Gemini Language UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini UI language switching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- GEMINI-LANGUAGE-FIX-V2 -->'
          if marker in s:
              print('Already patched')
              raise SystemExit
          patch = r'''\n<!-- GEMINI-LANGUAGE-FIX-V2 -->\n<script>\n(function(){\n  const descMy={\n    'Bright':'တောက်ပ', 'Upbeat':'တက်ကြွ', 'Informative':'သတင်းအချက်အလက်ပေးသော',\n    'Firm':'ခိုင်မာ', 'Excitable':'စိတ်လှုပ်ရှားဖွယ်', 'Youthful':'နုပျို',\n    'Breezy':'ပေါ့ပါး', 'Easy-going':'အေးဆေး', 'Breathy':'လေသံပါသော',\n    'Clear':'ရှင်းလင်း', 'Smooth':'ချောမွေ့', 'Gravelly':'အသံကြမ်း',\n    'Soft':'နူးညံ့', 'Even':'တည်ငြိမ်', 'Mature':'ရင့်ကျက်',\n    'Forward':'ရဲရင့်', 'Friendly':'ဖော်ရွေ', 'Casual':'ပေါ့ပေါ့ပါးပါး',\n    'Gentle':'ညင်သာ', 'Lively':'သွက်လက်', 'Knowledgeable':'ဗဟုသုတပြည့်စုံ',\n    'Warm':'နွေးထွေး'\n  };\n  const descEn=Object.fromEntries(Object.entries(descMy).map(([en,my])=>[my,en]));\n  function patchVoices(){\n    const lang=document.documentElement.lang==='en'?'en':'my';\n    const voice=document.getElementById('voice');\n    if(!voice) return;\n    Array.from(voice.options).forEach(o=>{\n      if(!o.dataset.geminiBase) o.dataset.geminiBase=o.textContent.trim();\n      const base=o.dataset.geminiBase;\n      const parts=base.split(/\\s*[—–-]\\s*/);\n      if(parts.length<2) return;\n      const name=parts[0].trim();\n      const desc=parts.slice(1).join(' — ').trim();\n      o.textContent=name+' — '+(lang==='my'?(descMy[desc]||desc):(descEn[desc]||desc));\n    });\n  }\n  function patchGeminiText(){\n    const lang=document.documentElement.lang==='en'?'en':'my';\n    const items=[\n      ['Gemini API Key','Gemini API ကီး'],\n      ['Paste your Gemini API key','Gemini API ကီးထည့်ပါ'],\n      ['Show','ပြမယ်'],['Hide','ဖျောက်မယ်'],\n      ['Save','သိမ်းမယ်'],['Clear','ဖျက်မယ်']\n    ];\n    document.querySelectorAll('label,button,.note,.mode span,.mode strong,.eyebrow,.outputTitle,.ready').forEach(el=>{\n      if(el.children.length) return;\n      if(!el.dataset.geminiOriginal) el.dataset.geminiOriginal=el.textContent.trim();\n      const original=el.dataset.geminiOriginal;\n      const pair=items.find(x=>x[0]===original || x[1]===original);\n      if(pair) el.textContent=lang==='my'?pair[1]:pair[0];\n    });\n    const key=document.getElementById('key');\n    if(key) key.placeholder=lang==='my'?'Gemini API ကီးထည့်ပါ':'Paste your Gemini API key';\n    patchVoices();\n  }\n  const oldSet=window.setLang;\n  window.setLang=function(lang){\n    if(typeof oldSet==='function') oldSet(lang);\n    setTimeout(patchGeminiText,0);\n    setTimeout(patchGeminiText,100);\n  };\n  new MutationObserver(function(){patchGeminiText()}).observe(document.body,{subtree:true,childList:true,characterData:true});\n  setTimeout(patchGeminiText,50);\n  setInterval(patchVoices,300);\n})();\n</script>\n'''
          s = s.replace('</body>', patch + '</body>')
          p.write_text(s, encoding='utf-8')
          print('Patched index.html for all 30 Gemini voices')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix all 30 Gemini voice language labels'
            git push
          fi
