name: Restore 5000 character TTS limit

on:
  push:
    paths:
      - '.github/workflows/fix-labels.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore 5000-character TTS UI
        run: node scripts/patch-unlimited-tts.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore 5000-character TTS UI limit'
          git push
