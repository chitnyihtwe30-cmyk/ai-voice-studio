<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Voice Studio</title><style>body{margin:0;background:#070912;color:#f8faff;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#111729;border:1px solid #ffffff18;border-radius:24px;padding:20px;box-shadow:0 20px 60px #0008}h1{margin:0 0 6px}p,.status{color:#aeb8cc;font-size:13px}textarea,select,input{width:100%;box-sizing:border-box;background:#080b15;color:#fff;border:1px solid #ffffff18;border-radius:14px;padding:13px;margin:7px 0 14px}textarea{min-height:220px;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{border:1px solid #ffffff18;background:#ffffff08;color:#fff;border-radius:15px;padding:14px;text-align:left}.mode.on{border-color:#8b5cf6;background:#7c3aed25}button{font:inherit}.go{width:100%;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:900;margin-top:8px}.stop{width:100%;padding:12px;border:1px solid #ffffff18;border-radius:15px;background:#ffffff08;color:#fff;margin-top:8px}.panel{margin-top:12px}.hide{display:none}.counter{text-align:right;color:#9da7bd;font-size:11px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>🎙️ AI Voice Studio</h1><p>ဖုန်းပေါ်မှာ Local အနေနဲ့ အသံထုတ်ရန်။ Gemini/API မသုံးပါ။</p><div class="counter" id="counter">0 / 5,000</div><textarea id="text" maxlength="5000" placeholder="စာသားရေးပါ..."></textarea><div class="grid"><button id="voiceMode" class="mode on">🔊 Local Voice<br><small>ဖုန်းထဲက TTS engine</small></button><button id="cloneMode" class="mode">🎙️ Voice Clone<br><small>ကိုယ့်အသံ model</small></button></div><div id="voicePanel" class="panel"><label>Language</label><select id="lang"><option value="my-MM">မြန်မာ</option><option value="en-US">English</option></select><label>Speed <span id="speedVal">1.00x</span></label><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></div><div id="clonePanel" class="panel hide"><p>Voice Clone ကို local on-device model နဲ့ ဆက်ထည့်မယ်။ Reference audio ကို ဒီ version မှာ cloud server ဆီ မပို့ပါ။</p><input id="sample" type="file" accept="audio/*"><p id="sampleName"></p></div><button class="go" id="go">▶ အသံထုတ်မယ်</button><button class="stop" id="stop">■ ရပ်မယ်</button><div class="status" id="status">READY • LOCAL</div></section></main><script>const $=id=>document.getElementById(id);let mode='voice',voices=[];function refresh(){voices=speechSynthesis.getVoices()}speechSynthesis.onvoiceschanged=refresh;refresh();$('text').oninput=()=>{$('counter').textContent=$('text').value.length+' / 5,000'};$('speed').oninput=()=>{$('speedVal').textContent=Number($('speed').value).toFixed(2)+'x'};$('voiceMode').onclick=()=>{mode='voice';$('voiceMode').classList.add('on');$('cloneMode').classList.remove('on');$('voicePanel').classList.remove('hide');$('clonePanel').classList.add('hide')};$('cloneMode').onclick=()=>{mode='clone';$('cloneMode').classList.add('on');$('voiceMode').classList.remove('on');$('voicePanel').classList.add('hide');$('clonePanel').classList.remove('hide')};$('sample').onchange=()=>{$('sampleName').textContent=$('sample').files[0]?.name||''};$('go').onclick=()=>{const text=$('text').value.trim();if(!text)return $('status').textContent='စာသားထည့်ပါ';if(mode==='clone'){if(!$('sample').files.length)return $('status').textContent='Voice sample ရွေးပါ';return $('status').textContent='Local Voice Clone model ကို device ထဲထည့်ပြီးမှ clone ပြုလုပ်နိုင်ပါမယ်';}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=$('lang').value;u.rate=Number($('speed').value);u.volume=1;const list=voices.filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));if(list[0])u.voice=list[0];u.onstart=()=>$('status').textContent='SPEAKING • LOCAL';u.onend=()=>$('status').textContent='DONE • LOCAL';u.onerror=()=>$('status').textContent='ဒီဖုန်းမှာ ရွေးထားတဲ့ language voice မရှိပါ';speechSynthesis.speak(u)};$('stop').onclick=()=>{speechSynthesis.cancel();$('status').textContent='STOPPED • LOCAL'};</script></body></html>
